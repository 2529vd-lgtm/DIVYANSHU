# Posts each new article to Instagram (picture + caption, and the article link as a comment).
# Runs when an article is published, every 3 hours as a backup, and by hand from the Actions tab.
name: Post to Instagram

on:
  push:
    branches: [claude/hello-rmr06a]
    paths: [content/articles.json]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      article:
        description: 'Post one article again: "latest", a word from its title, or its id. Leave empty for all new ones.'
        required: false
        default: ""

concurrency:
  group: instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/hello-rmr06a
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==11.3.0
      - name: Post new articles
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ARTICLE: ${{ github.event.inputs.article }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          python scripts/instagram/post.py "$ARTICLE"
