<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="padding-top:24px;padding-bottom:20px" id="main">
    <p class="empty">Loading…</p>
  </main>

  <div id="site-footer"></div>

  <script src="js/vendor/marked.umd.js"></script>
  <script src="js/vendor/purify.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const site = await renderChrome("exams");
      const main = document.getElementById("main");
      const [{ exams }, { items }] = await Promise.all([
        loadJSON("content/exams.json", { exams: [] }),
        loadJSON("content/exam-items.json", { items: [] }),
      ]);
      const exam = exams.find((e) => e.id === param("id"));
      if (!exam) return showError(main, "Ye exam nahi mila.");
      document.title = `${exam.name} | ${site.name}`;

      const subjects = exam.subjects || [];
      const examItems = items.filter((i) => i.exam === exam.id);
      let view = param("view") === "material" || param("subject") ? "material" : "syllabus";
      let subject = param("subject") || "all";
      let type = param("type") || "long";

      main.innerHTML = `
        <div class="breadcrumb"><a href="exams.html">Exam Corner</a> › ${esc(exam.name)}</div>
        <div class="exam-hero">
          <h1 class="page-title">${esc(exam.name)}</h1>
          ${exam.fullName ? `<p class="muted">${esc(exam.fullName)}</p>` : ""}
          <p style="margin:10px 0 6px"><b>Exam date:</b> ${fmtDate(exam.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" })}${exam.time ? `, ${esc(exam.time)}` : ""}</p>
          <div class="countdown big" data-countdown="${examTime(exam).toISOString()}"></div>
          ${exam.description ? `<div class="prose" style="font-size:0.98rem;margin-top:14px">${renderMarkdown(exam.description)}</div>` : ""}
        </div>
        <div class="tabs" id="view-tabs">
          <button class="tab" data-view="syllabus">📘 Syllabus</button>
          <button class="tab" data-view="material">📚 Subject-wise Study Material</button>
        </div>
        <div id="syllabus" class="panel prose">${renderMarkdown(exam.syllabus || "Syllabus jald add hoga.")}</div>
        <div id="material">
          <label>Subject chunein</label>
          <div class="tabs" id="subject-tabs"></div>
          <label>Kya padhna hai?</label>
          <div class="tabs" id="type-tabs"></div>
          <div class="grid" id="items"></div>
        </div>`;
      startCountdowns();

      const syncURL = () => {
        const p = new URLSearchParams({ id: exam.id });
        if (view === "material") { p.set("view", "material"); p.set("subject", subject); p.set("type", type); }
        history.replaceState(null, "", `exam.html?${p}`);
      };

      const draw = () => {
        document.querySelectorAll("#view-tabs .tab").forEach((t) => t.classList.toggle("active", t.dataset.view === view));
        document.getElementById("syllabus").classList.toggle("hidden", view !== "syllabus");
        document.getElementById("material").classList.toggle("hidden", view !== "material");

        const inSubject = examItems.filter((i) => subject === "all" || i.subject === subject);
        document.getElementById("subject-tabs").innerHTML = [{ id: "all", name: "All subjects" }, ...subjects]
          .map((s) => {
            const n = examItems.filter((i) => s.id === "all" || i.subject === s.id).length;
            return `<button class="tab ${s.id === subject ? "active" : ""}" data-subject="${esc(s.id)}">${esc(s.name)}<span class="count">${n}</span></button>`;
          })
          .join("");
        document.getElementById("type-tabs").innerHTML = ITEM_TYPES.map(
          (t) => `<button class="tab ${t.id === type ? "active" : ""}" data-type="${t.id}">${t.label}<span class="count">${inSubject.filter((i) => i.type === t.id).length}</span></button>`
        ).join("");

        const list = inSubject.filter((i) => i.type === type);
        const subjectName = (id) => (subjects.find((s) => s.id === id) || {}).name || "";
        document.getElementById("items").innerHTML = list.length
          ? list
              .map((i) => {
                const href = i.type === "mock" ? `mock.html?id=${encodeURIComponent(i.id)}` : `item.html?id=${encodeURIComponent(i.id)}`;
                const extra = i.type === "mock" ? `<p>${i.questions || 0} questions · ${i.duration || 0} min</p>` : i.summary ? `<p>${esc(i.summary)}</p>` : "";
                return `<a class="card" href="${href}">
                  <span class="tag">${esc(subjectName(i.subject) || "General")}</span>
                  <h3 style="margin-top:8px">${esc(i.title)}</h3>${extra}
                  <div class="meta" style="margin-top:6px">${fmtDate(i.date)}</div>
                </a>`;
              })
              .join("")
          : `<p class="empty">Is subject mein abhi ${esc(ITEM_TYPES.find((t) => t.id === type).label)} nahi hai.</p>`;
      };

      main.addEventListener("click", (e) => {
        const t = e.target.closest(".tab");
        if (!t) return;
        if (t.dataset.view) view = t.dataset.view;
        if (t.dataset.subject) subject = t.dataset.subject;
        if (t.dataset.type) type = t.dataset.type;
        syncURL();
        draw();
      });
      draw();
    });
  </script>
</body>
</html>
